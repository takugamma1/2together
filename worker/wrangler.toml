name = "club-backend"
main = "src/index.js"
compatibility_date = "2026-06-01"

[vars]
# Public Google Place ID for the /reviews endpoint (the API key is a secret).
GOOGLE_PLACE_ID = "ChIJqfizUnBVpEARaF0yq_Yt1Ws"
# Channel ID (UC...) for the /youtube endpoint. Find it at
# youtube.com → your channel → About → Share channel → Copy channel ID.
YOUTUBE_CHANNEL_ID = "UC9-YryJX2y-nWlLHbb24VWA"

# ── Econt Express (see src/econt.js) ─────────────────────────────────
# Sandbox while testing; switch to https://ee.econt.com/services with the
# shop's real ee.econt.com profile (secrets ECONT_USER / ECONT_PASS).
ECONT_API_BASE = "https://demo.econt.com/ee/services"
ECONT_SENDER_NAME = "2GETHER Bikes"
ECONT_SENDER_PHONE = ""
# Office code the shop drops parcels at (empty = courier picks up from the address below).
ECONT_SENDER_OFFICE = ""
ECONT_SENDER_CITY = "Варна"
ECONT_SENDER_POSTCODE = "9000"
ECONT_SENDER_STREET = ""
ECONT_SENDER_NUM = ""
# Weight (kg) assumed when products have no weight set.
ECONT_DEFAULT_WEIGHT_KG = "1"
# Free delivery from this order subtotal in EUR (0 = never).
SHIP_FREE_OVER = "0"
# Flat EUR prices shown at checkout only if Econt cannot be reached.
ECONT_FALLBACK_OFFICE = "7"
ECONT_FALLBACK_ADDRESS = "9"
